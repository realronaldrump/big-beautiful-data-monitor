# Generates "Big Beautiful Data Monitor.xcodeproj" with XcodeGen (`xcodegen generate` in this folder).
name: Big Beautiful Data Monitor
options:
  bundleIdPrefix: com.davisdeaton
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  Engine:
    path: ../Engine
targets:
  DataMonitor:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: Engine
        product: MonitorEngine
      - package: Engine
        product: UsageStore
      - sdk: ServiceManagement.framework
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Big Beautiful Data Monitor
        CFBundleName: Data Monitor
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Made for one Mac."
    settings:
      base:
        PRODUCT_NAME: Big Beautiful Data Monitor
        PRODUCT_BUNDLE_IDENTIFIER: com.davisdeaton.BigBeautifulDataMonitor
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ARCHS: arm64
        # "Sign to Run Locally": no developer account and nothing that expires.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        # The app launches nettop and inspects other processes, which the sandbox blocks.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
